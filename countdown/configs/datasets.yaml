# Per-dataset roots, globs and label-mapping rules.
#
# label_rules are an ORDERED list; the first regex that matches the lower-cased filename
# stem wins.  Order matters -- e.g. "chat" must be tested before "mail" so that
# "gmailchat1" is chat and not email.  A stem that matches no rule is a hard error
# (see `on_unmapped`), never a silent drop.

data_root: data

# --- group keys for leakage-safe splitting (Phase 3) ----------------------------------
# Which key keeps correlated samples on one side of a split.  `source_file` is only right
# where one capture yields many flows; on CSTNET and MobileApp it yields exactly one, so
# grouping by it IS a random split (46,372 groups for 46,372 samples).  Measured
# alternatives and the reasoning are in phases/PHASE-3.md section 5.3.
#
# Deliberately a top-level block, NOT a key inside each dataset spec: `Config.flow_key`
# hashes the whole dataset spec into the parsed-flow cache key, so adding `group_key:`
# under `datasets:` would invalidate every cache and force a re-parse of the 90 GB corpus
# for something that cannot change (X, y).  Same reasoning as `reassembly:` in
# features.yaml.
group_keys:
  iscxvpn: source_file        # 16,094 flows / 140 captures
  iscxtor: source_file        # 54,429 flows /  95 captures
  cstnet: capture_day         # 1 pcap == 1 flow; the real correlation is the crawl batch
  mobileapp: source_file      # 1 CSV == 1 sample: vacuous, and unavoidable (see below)
  postquantumtls: source_file # not a classifier target; Phase-2 KEM ground truth

# Datasets whose grouping is vacuous by construction and cannot be fixed by choosing a
# different key.  `eval.splits.group_split` refuses a vacuous grouping unless told that
# the caller already knows -- this list is that acknowledgement, kept next to the data it
# describes rather than passed by hand at every call site.
allow_vacuous_groups: [mobileapp]

# --- application-label normalisation (Phase 4, Okonkwo reproduction) ------------------
# The raw `app` label on both ISCX sets is the capture-filename stem: `facebook_audio1a`,
# `facebook_audio2`, `facebook_audio4` are three "classes" for one app+modality, and
# `chat_gate_skype_chat` / `voip_gate_skype_audio` are Tor-gateway spellings of Skype.
# That is why `invalid_targets: [app]` exists -- ~1 class per source file makes a
# group-aware split undefined.  These rules recover the real class set:
#
#   app_norm      the service           facebook, skype, hangouts, youtube, ...
#   app_activity  service + modality    facebook_audio, skype_video, ...
#
# `app_activity` is `app_norm` + a short token derived from traffic_type, which is exactly
# the naming Okonkwo's non-VPN application task uses (Fig. 5a).  Both are added by
# `countdown.data.app_labels` in the loader's `postprocess()` hook, so the raw `app` field
# and its `invalid_targets` guard are untouched.
#
# Top-level, NOT inside `datasets:` -- same reason as `group_keys:` above: `Config.flow_key`
# hashes the dataset spec, so putting these there would orphan every parsed-flow cache and
# force a re-parse of the 34 GB ISCX corpus for a label that cannot change (X).
#
# ORDERED: first regex to match the lower-cased stem wins.  Order is load-bearing --
# `gmail` before `email` (gmailchat1), `thunderbird` before `email`, `ftps` before `sftp`
# before `ftp` (each is a substring of the next), and every named service before the
# generic `browsing` catch-all.
app_rules:
  # -- named applications --------------------------------------------------------------
  - {pattern: "facebook",              app: facebook}
  - {pattern: "hangouts?",             app: hangouts}
  - {pattern: "skype",                 app: skype}
  - {pattern: "gmail",                 app: gmail}
  - {pattern: "aim_?chat",             app: aim}
  - {pattern: "icq_?chat",             app: icq}
  - {pattern: "youtube",               app: youtube}
  - {pattern: "netflix",               app: netflix}
  - {pattern: "vimeo",                 app: vimeo}
  - {pattern: "spotify",               app: spotify}
  - {pattern: "voipbuster",            app: voipbuster}
  - {pattern: "thunderbird",           app: thunderbird}
  - {pattern: "twitter",               app: twitter}
  - {pattern: "google",                app: google}
  # -- transfer / mail protocols (ftps before sftp before ftp: substring chain) ---------
  - {pattern: "ftps",                  app: ftps}
  - {pattern: "sftp",                  app: sftp}
  - {pattern: "ftp",                   app: ftp}
  - {pattern: "scp",                   app: scp}
  - {pattern: "imap|pop|email|mail",   app: email}
  # -- p2p -----------------------------------------------------------------------------
  - {pattern: "vuze",                  app: vuze}
  - {pattern: "multiplespeed",         app: multiplespeed}
  - {pattern: "bittorrent|torrent",    app: bittorrent}
  # -- generic web ----------------------------------------------------------------------
  - {pattern: "ssl|browsing",          app: browsing}

# traffic_type -> the short modality token appended to build `app_activity`.
app_modality:
  voip: audio
  audio_streaming: audio
  video_streaming: video
  chat: chat
  file_transfer: file
  email: email
  browsing: browsing
  p2p: p2p

# Datasets whose `app` stem should be normalised by the rules above.
app_rules_datasets: [iscxvpn, iscxtor]

# --- pooled datasets ------------------------------------------------------------------
# A pooled dataset loads several constituents and concatenates their flows.  ISCXVPN alone
# realises 7 of 8 traffic types (no `browsing` captures exist) and its entire `p2p` class
# is one file, so a group-aware split cannot place p2p on both sides -- pooling with
# ISCXTor is mandatory, not a convenience.  See phases/PHASE-3.md section 6.
pooled:
  iscx_pooled:
    members: [iscxvpn, iscxtor]
    default_target: traffic_type
    group_key: source_file
    invalid_targets: [app]    # capture-filename stems on both constituents

datasets:

  # ------------------------------------------------------------------ ISCXVPN2016 -----
  iscxvpn:
    root: ISCXVPN2016
    glob: ["**/*.pcap", "**/*.pcapng"]
    granularity: split          # one pcap -> many flows (5-tuple split)
    default_target: traffic_type
    on_unmapped: error
    invalid_targets: [app]   # "app" here = capture-filename stems (~1 class/file), not a real target
    # `vpn_` prefix is stripped before matching and sets is_vpn=true
    vpn_prefix: "vpn_"
    label_rules:
      - {pattern: "bittorrent|torrent",              traffic_type: p2p}
      - {pattern: "_file|scp|sftp|ftps|ftp|transfer", traffic_type: file_transfer}
      - {pattern: "_video|netflix|youtube|vimeo",    traffic_type: video_streaming}
      - {pattern: "spotify",                         traffic_type: audio_streaming}
      - {pattern: "_audio|voipbuster|voip",          traffic_type: voip}
      - {pattern: "chat",                            traffic_type: chat}
      - {pattern: "email|mail",                      traffic_type: email}
      - {pattern: "browsing",                        traffic_type: browsing}

  # ------------------------------------------------------------------ ISCXTor2016 -----
  iscxtor:
    root: ISCXTor2016
    glob: ["Tor/**/*.pcap", "Tor/**/*.pcapng", "NonTor/**/*.pcap", "NonTor/**/*.pcapng"]
    granularity: split
    default_target: traffic_type
    on_unmapped: error
    invalid_targets: [app]   # "app" here = capture-filename stems (~1 class/file), not a real target
    tor_dir: Tor                # files under this top-level dir get is_tor=true
    label_rules:
      # explicit ISCXTor category prefixes take priority over content keywords
      - {pattern: "^file-transfer",  traffic_type: file_transfer}
      - {pattern: "^mail",           traffic_type: email}
      - {pattern: "^voip",           traffic_type: voip}
      - {pattern: "^video",          traffic_type: video_streaming}
      - {pattern: "^audio",          traffic_type: audio_streaming}
      - {pattern: "^browsing",       traffic_type: browsing}
      - {pattern: "^chat",           traffic_type: chat}
      - {pattern: "^p2p",            traffic_type: p2p}
      # content keywords
      - {pattern: "torrent|vuze|p2p",                     traffic_type: p2p}
      - {pattern: "thunderbird|imap|^pop_|_pop|email|mail", traffic_type: email}
      - {pattern: "spotify",                              traffic_type: audio_streaming}
      - {pattern: "vimeo|youtube|video",                  traffic_type: video_streaming}
      - {pattern: "voice|_audio|voip",                    traffic_type: voip}
      - {pattern: "chat",                                 traffic_type: chat}
      - {pattern: "filetransfer|transfer|sftp|ftp|scp",   traffic_type: file_transfer}
      - {pattern: "browsing|ssl|google|twitter|facebook", traffic_type: browsing}

  # ---------------------------------------------------------------- CSTNET-TLS1.3 -----
  cstnet:
    root: CSTNET-TLS1.3
    ingest_mode: raw            # raw | etbert (etbert is a Phase-4 hook, not implemented)
    raw_subdir: "extracted/cstnet-tls 1.3"
    etbert_subdir: "extracted/flow_500"
    glob: ["*/*.pcap"]
    granularity: session        # one pcap == one TLS session -> keep its largest flow
    default_target: app
    label_from: parent_dir      # app label is the containing directory name
    filters:
      top_k_apps: null          # e.g. 20 for fast iteration
      min_samples_per_class: 0
      max_pcaps_per_app: null   # e.g. 50 to subsample the 491 pcaps/app

  # -------------------------------------------------------------- PostQuantumTLS -----
  postquantumtls:
    root: PostQuantumTLS
    glob: ["pcaps/*.pcap"]
    granularity: split          # one pcap per package, but each holds many flows
    # NOTE: these files are pcapng despite the .pcap suffix; the reader sniffs magic bytes.
    default_target: app
    label_from: stem            # label is the package id
    # Primary use is Phase 2 (KEM ground truth); Phase 0 only needs it to load.

  # ------------------------------------------ MobileAppActivity-Sensors2022 (CSV) -----
  mobileapp:
    root: MobileAppActivity-Sensors2022
    csv_subdir: D-OutCsv
    glob: ["*/*/*.csv"]
    granularity: whole          # one CSV == one capture == one sample (no 5-tuple: 802.11 frames)
    default_target: activity
    columns:
      ts: frame.time_relative
      size: frame.len
      src: wlan.sa
      dst: wlan.da
      ta: wlan.ta
      ra: wlan.ra
    filters:
      min_samples_per_class: 0
      top_k_classes: null
