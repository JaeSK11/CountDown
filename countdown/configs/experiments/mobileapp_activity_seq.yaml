# Sequence member, recommended (D1d): dilated-residual CNN on signed sizes + IATs.
dataset: mobileapp
target: activity
model: seq_cnn
features: packet_seq
feature_params:
  n: 256
  channels: 2
grouped: true
test_size: 0.25             # 4 captures per class: a 5-way split cannot hold every class
val_size: 0.0               # no capture to spare for a val fold; same split as the GBDT floor
tail_min_support: 2
notes: Dilated-residual CNN through training/deep.py; no class weights (D5).
