# Sequence member, paper baseline: Deep Fingerprinting on direction-only sequences.
# n=5000 is the paper's input length; on flow-level ETC data most of it is padding.
dataset: mobileapp
target: activity
model: seq_cnn_baseline
features: dir_seq
feature_params:
  n: 5000
grouped: true
test_size: 0.25             # 4 captures per class: a 5-way split cannot hold every class
val_size: 0.0               # no capture to spare for a val fold; same split as the GBDT floor
tail_min_support: 2
notes: DF (Sirinam et al., CCS'18) as published -- Adamax 2e-3, batch 128, 30 epochs, final model.
