# TLS "Supported Groups" codepoint -> quantum-resistance classification.
#
# Source: IANA TLS Parameters, "TLS Supported Groups" registry, plus the pre-standard
# codepoints that real deployments still emit (Cloudflare / Chrome / oqs-provider).
#
# This file is the *whole* basis of the PQC verdict: a flow is quantum-resistant iff the
# negotiated group's `family` is `hybrid` or `pqc`.  Keeping it as versioned data rather
# than a Python dict is deliberate -- PQC codepoints are still churning (draft Kyber vs
# standardised ML-KEM), and extending a YAML table must never require a code change.
#
# family:
#   classical  ECDH / FFDHE -- broken by a CRQC (Shor).  The harvest-now-decrypt-later risk.
#   hybrid     classical + PQ KEM concatenated; secure if *either* half holds.
#   pqc        pure post-quantum KEM, no classical component.
#
# status: standard | draft | obsolete   (obsolete = superseded codepoint still seen on the wire)
# nist_level: NIST PQC security category (1/3/5) for the PQ component; null for classical.

version: "2026-08-23"
source: "IANA TLS Supported Groups + deployed pre-standard codepoints"

groups:

  # ---------------------------------------------------------------- classical: ECDH ----
  # Binary-field (sect*) and small prime curves.  Legacy, effectively dead on the wire,
  # but present in old ClientHello supported_groups lists.
  - {codepoint: 0x0001, name: sect163k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0002, name: sect163r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0003, name: sect163r2,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0004, name: sect193r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0005, name: sect193r2,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0006, name: sect233k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0007, name: sect233r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0008, name: sect239k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0009, name: sect283k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000A, name: sect283r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000B, name: sect409k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000C, name: sect409r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000D, name: sect571k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000E, name: sect571r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x000F, name: secp160k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0010, name: secp160r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0011, name: secp160r2,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0012, name: secp192k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0013, name: secp192r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0014, name: secp224k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0015, name: secp224r1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0x0016, name: secp256k1,  family: classical, algo: ECDH, nist_level: null, status: obsolete}

  # The curves that actually carry traffic today.
  - {codepoint: 0x0017, name: secp256r1,  family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x0018, name: secp384r1,  family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x0019, name: secp521r1,  family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x001A, name: brainpoolP256r1, family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x001B, name: brainpoolP384r1, family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x001C, name: brainpoolP512r1, family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x001D, name: x25519,     family: classical, algo: X25519, nist_level: null, status: standard}
  - {codepoint: 0x001E, name: x448,       family: classical, algo: X448,   nist_level: null, status: standard}
  - {codepoint: 0x001F, name: brainpoolP256r1tls13, family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x0020, name: brainpoolP384r1tls13, family: classical, algo: ECDH, nist_level: null, status: standard}
  - {codepoint: 0x0021, name: brainpoolP512r1tls13, family: classical, algo: ECDH, nist_level: null, status: standard}

  # Russian (GOST) and Chinese (SM2) national curves.
  - {codepoint: 0x0022, name: GC256A,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0023, name: GC256B,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0024, name: GC256C,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0025, name: GC256D,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0026, name: GC512A,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0027, name: GC512B,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0028, name: GC512C,     family: classical, algo: GOST, nist_level: null, status: standard}
  - {codepoint: 0x0029, name: curveSM2,   family: classical, algo: SM2,  nist_level: null, status: standard}

  # --------------------------------------------------------------- classical: FFDHE ----
  - {codepoint: 0x0100, name: ffdhe2048,  family: classical, algo: FFDHE, nist_level: null, status: standard}
  - {codepoint: 0x0101, name: ffdhe3072,  family: classical, algo: FFDHE, nist_level: null, status: standard}
  - {codepoint: 0x0102, name: ffdhe4096,  family: classical, algo: FFDHE, nist_level: null, status: standard}
  - {codepoint: 0x0103, name: ffdhe6144,  family: classical, algo: FFDHE, nist_level: null, status: standard}
  - {codepoint: 0x0104, name: ffdhe8192,  family: classical, algo: FFDHE, nist_level: null, status: standard}

  # ------------------------------------------------------------------- pqc: pure ML-KEM ----
  # draft-connolly-tls-mlkem-key-agreement.  Pure PQ: no classical fallback, so a break in
  # ML-KEM breaks the exchange outright -- which is why deployments prefer the hybrids below.
  - {codepoint: 0x0200, name: MLKEM512,   family: pqc, algo: ML-KEM-512,  nist_level: 1, status: draft}
  - {codepoint: 0x0201, name: MLKEM768,   family: pqc, algo: ML-KEM-768,  nist_level: 3, status: draft}
  - {codepoint: 0x0202, name: MLKEM1024,  family: pqc, algo: ML-KEM-1024, nist_level: 5, status: draft}

  # ------------------------------------------------------------------------ hybrid ----
  # draft-ietf-tls-hybrid-design / draft-kwiatkowski-tls-ecdhe-mlkem.
  # X25519MLKEM768 (0x11EC) is the one that matters in practice: Chrome, Firefox,
  # Cloudflare, Google and AWS all default to it.
  - {codepoint: 0x11E9, name: SecP256r1MLKEM512,   family: hybrid, algo: secp256r1+ML-KEM-512,  nist_level: 1, status: draft}
  - {codepoint: 0x11EA, name: MLKEM512X25519,      family: hybrid, algo: ML-KEM-512+X25519,     nist_level: 1, status: draft}
  - {codepoint: 0x11EB, name: SecP256r1MLKEM768,   family: hybrid, algo: secp256r1+ML-KEM-768,  nist_level: 3, status: standard}
  - {codepoint: 0x11EC, name: X25519MLKEM768,      family: hybrid, algo: X25519+ML-KEM-768,     nist_level: 3, status: standard}
  - {codepoint: 0x11ED, name: SecP384r1MLKEM1024,  family: hybrid, algo: secp384r1+ML-KEM-1024, nist_level: 5, status: standard}
  - {codepoint: 0x11EE, name: curveSM2MLKEM768,    family: hybrid, algo: curveSM2+ML-KEM-768,   nist_level: 3, status: draft}

  # Pre-standard Kyber hybrids.  Chrome 116-123 and Cloudflare shipped 0x6399 widely in
  # 2023-2024; captures from that era (PostQuantumTLS included) carry it, so it must
  # classify as hybrid even though IANA marks it obsolete.
  - {codepoint: 0x6399, name: X25519Kyber768Draft00,    family: hybrid, algo: X25519+Kyber768,    nist_level: 3, status: obsolete}
  - {codepoint: 0x639A, name: SecP256r1Kyber768Draft00, family: hybrid, algo: secp256r1+Kyber768, nist_level: 3, status: obsolete}
  # NOTE: the oqs-provider private-use codepoints (0xFE3x / 0x02xx region) are deliberately
  # NOT listed.  They were reassigned between liboqs releases -- 0x0200 meant frodo640aes
  # before IANA gave it to MLKEM512 -- so a stale entry here would produce a *false PQC
  # positive*, the one error this project must not make.  They fall through to `unknown`,
  # which is logged and honest.  Add them only against a pinned oqs-provider version.

  # --------------------------------------------------------------------- special ----
  # Not key agreement at all -- explicit curve parameters, TLS 1.2 and earlier.
  - {codepoint: 0xFF01, name: arbitrary_explicit_prime_curves, family: classical, algo: ECDH, nist_level: null, status: obsolete}
  - {codepoint: 0xFF02, name: arbitrary_explicit_char2_curves, family: classical, algo: ECDH, nist_level: null, status: obsolete}
