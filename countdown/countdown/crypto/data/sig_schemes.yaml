# TLS SignatureScheme codepoint -> classification (Phase 2, task 2.4).
#
# Generated from the IANA "TLS SignatureScheme" registry CSV; regenerate with
# scripts/refresh_registries.py rather than editing by hand.
#
# IMPORTANT -- these are rarely observable.  In TLS 1.3 the Certificate and
# CertificateVerify messages are encrypted, so the only signature evidence a passive
# observer normally gets is the ClientHello's `signature_algorithms` extension, which
# states what the client would ACCEPT, not what the server actually used.  PQC
# signature detection is therefore a weak, advisory signal -- the KEM is the verdict.

