# X.509 algorithm OID -> classification (Phase 7, task 7.1).
#
# Two kinds of OID appear in a certificate and both are looked up here:
#   * the SubjectPublicKeyInfo algorithm -- what the subject's key IS (`kind: key`)
#   * the signatureAlgorithm             -- how the issuer SIGNED it (`kind: signature`)
#
# Only post-quantum OIDs that NIST has assigned (FIPS 204 ML-DSA, FIPS 205 SLH-DSA, FIPS 203
# ML-KEM) are listed as pqc.  Draft composite / Falcon OIDs are deliberately absent: an OID
# we do not recognise is reported as `unknown(<dotted>)`, never guessed into a family.
#
# Certificates are cleartext only before TLS 1.3 (and in TLS 1.2 client authentication); in
# TLS 1.3 and QUIC the chain is encrypted and this table is never consulted.

version: "2026-11-04"
source: "RFC 3279/4055/5480/5758/8410, NIST CSOR (FIPS 203/204/205), GB/T 32918"

algorithms:
  # -- public keys ------------------------------------------------------------------------
  - {oid: 1.2.840.113549.1.1.1,   name: rsaEncryption,     kind: key, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.10,  name: RSASSA-PSS,        kind: key, family: classical, algo: RSA}
  - {oid: 1.2.840.10045.2.1,      name: id-ecPublicKey,    kind: key, family: classical, algo: EC}
  - {oid: 1.2.840.10040.4.1,      name: id-dsa,            kind: key, family: classical, algo: DSA}
  - {oid: 1.2.840.10046.2.1,      name: dhpublicnumber,    kind: key, family: classical, algo: DH}
  - {oid: 1.3.101.110,            name: X25519,            kind: key, family: classical, algo: X25519}
  - {oid: 1.3.101.111,            name: X448,              kind: key, family: classical, algo: X448}
  - {oid: 1.3.101.112,            name: Ed25519,           kind: both, family: classical, algo: EdDSA}
  - {oid: 1.3.101.113,            name: Ed448,             kind: both, family: classical, algo: EdDSA}
  - {oid: 1.2.156.10197.1.301,    name: sm2,               kind: key, family: classical, algo: SM2}
  - {oid: 2.16.840.1.101.3.4.4.1, name: ML-KEM-512,        kind: key, family: pqc, algo: ML-KEM, nist_level: 1}
  - {oid: 2.16.840.1.101.3.4.4.2, name: ML-KEM-768,        kind: key, family: pqc, algo: ML-KEM, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.4.3, name: ML-KEM-1024,       kind: key, family: pqc, algo: ML-KEM, nist_level: 5}

  # -- signatures (classical) -------------------------------------------------------------
  - {oid: 1.2.840.113549.1.1.4,   name: md5WithRSAEncryption,    kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.5,   name: sha1WithRSAEncryption,   kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.11,  name: sha256WithRSAEncryption, kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.12,  name: sha384WithRSAEncryption, kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.13,  name: sha512WithRSAEncryption, kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.113549.1.1.14,  name: sha224WithRSAEncryption, kind: signature, family: classical, algo: RSA}
  - {oid: 1.2.840.10045.4.1,      name: ecdsa-with-SHA1,         kind: signature, family: classical, algo: ECDSA}
  - {oid: 1.2.840.10045.4.3.1,    name: ecdsa-with-SHA224,       kind: signature, family: classical, algo: ECDSA}
  - {oid: 1.2.840.10045.4.3.2,    name: ecdsa-with-SHA256,       kind: signature, family: classical, algo: ECDSA}
  - {oid: 1.2.840.10045.4.3.3,    name: ecdsa-with-SHA384,       kind: signature, family: classical, algo: ECDSA}
  - {oid: 1.2.840.10045.4.3.4,    name: ecdsa-with-SHA512,       kind: signature, family: classical, algo: ECDSA}
  - {oid: 1.2.840.10040.4.3,      name: dsa-with-sha1,           kind: signature, family: classical, algo: DSA}
  - {oid: 2.16.840.1.101.3.4.3.2, name: dsa-with-sha256,         kind: signature, family: classical, algo: DSA}
  - {oid: 1.2.156.10197.1.501,    name: SM2-with-SM3,            kind: signature, family: classical, algo: SM2}

  # -- signatures (post-quantum; the same OID names the key) ------------------------------
  - {oid: 2.16.840.1.101.3.4.3.17, name: ML-DSA-44, kind: both, family: pqc, algo: ML-DSA, nist_level: 2}
  - {oid: 2.16.840.1.101.3.4.3.18, name: ML-DSA-65, kind: both, family: pqc, algo: ML-DSA, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.3.19, name: ML-DSA-87, kind: both, family: pqc, algo: ML-DSA, nist_level: 5}
  - {oid: 2.16.840.1.101.3.4.3.20, name: SLH-DSA-SHA2-128s,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 1}
  - {oid: 2.16.840.1.101.3.4.3.21, name: SLH-DSA-SHA2-128f,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 1}
  - {oid: 2.16.840.1.101.3.4.3.22, name: SLH-DSA-SHA2-192s,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.3.23, name: SLH-DSA-SHA2-192f,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.3.24, name: SLH-DSA-SHA2-256s,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 5}
  - {oid: 2.16.840.1.101.3.4.3.25, name: SLH-DSA-SHA2-256f,  kind: both, family: pqc, algo: SLH-DSA, nist_level: 5}
  - {oid: 2.16.840.1.101.3.4.3.26, name: SLH-DSA-SHAKE-128s, kind: both, family: pqc, algo: SLH-DSA, nist_level: 1}
  - {oid: 2.16.840.1.101.3.4.3.27, name: SLH-DSA-SHAKE-128f, kind: both, family: pqc, algo: SLH-DSA, nist_level: 1}
  - {oid: 2.16.840.1.101.3.4.3.28, name: SLH-DSA-SHAKE-192s, kind: both, family: pqc, algo: SLH-DSA, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.3.29, name: SLH-DSA-SHAKE-192f, kind: both, family: pqc, algo: SLH-DSA, nist_level: 3}
  - {oid: 2.16.840.1.101.3.4.3.30, name: SLH-DSA-SHAKE-256s, kind: both, family: pqc, algo: SLH-DSA, nist_level: 5}
  - {oid: 2.16.840.1.101.3.4.3.31, name: SLH-DSA-SHAKE-256f, kind: both, family: pqc, algo: SLH-DSA, nist_level: 5}

