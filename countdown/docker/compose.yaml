# docker compose -f countdown/docker/compose.yaml up -d gpu-queue   # start the queue daemon
# docker compose -f countdown/docker/compose.yaml run --rm job <cmd> # one-off command
name: countdown

x-common: &common
  image: countdown:cu130
  build:
    context: .
    dockerfile: Dockerfile
  user: "1000:1000"                    # files in runs/ stay owned by counterbitio
  volumes:
    - /home/counterbitio/CountDown:/home/counterbitio/CountDown
  working_dir: /home/counterbitio/CountDown/countdown
  shm_size: "32gb"                     # PyTorch DataLoader workers pass batches through /dev/shm
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # The GPU queue as a daemon: survives session ends, terminal closes and (restart policy)
  # reboots.  A job interrupted mid-run is put back at the head of the queue on restart.
  gpu-queue:
    <<: *common
    container_name: countdown-gpu-queue
    command: ["bash", "docker/gpu-queue-runner.sh"]
    environment:
      QUEUE_DAEMON: "1"
      IN_CONTAINER: "1"
      PY: python
    restart: unless-stopped
    init: true

  job:
    <<: *common
    profiles: ["manual"]
    environment:
      IN_CONTAINER: "1"
      PY: python

  # Live capture on the HOST's interfaces (deployment). host networking means it sees every
  # host interface and all their traffic -- run it only where you are allowed to monitor.
  # Capture is by the image's python-netraw (cap_net_raw file capability); NET_RAW is in
  # Docker's default set, NET_ADMIN is only needed for --promiscuous.
  #   docker compose -f docker/compose.yaml run --rm live countdown live eth0 --port 443
  live:
    <<: *common
    profiles: ["manual"]
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      IN_CONTAINER: "1"
      PY: python
