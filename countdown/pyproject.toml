[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "countdown"
version = "0.1.0"
description = "Encrypted-traffic crypto detection, PQC verdict, and ML traffic classification"
requires-python = ">=3.10"
dependencies = [
    "dpkt>=1.9.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    # Phase 3: model persistence.  Present transitively via scikit-learn, but countdown
    # imports it directly, so it is declared directly.
    "joblib>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "scapy>=2.5",
    # Phase 2: HKDF + AES-GCM/ChaCha20-Poly1305 for QUIC Initial decryption.
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Phase 3: the confusion-matrix PNG only.  Every run writes metrics.json regardless; the
# plot is skipped with a note when matplotlib is absent, never an ImportError.
viz = ["matplotlib>=3.7"]
# Phase 4: the deep members.  Every one of them lazy-imports these, so the registry, the
# tabular members and the whole Phase 0-3 surface work without them.  torch must be a CUDA
# build that matches the GPU -- an RTX 5090 (sm_120) needs CUDA >= 12.8, e.g.
#   pip install torch==2.14.0 torchvision==0.29.0 --index-url https://download.pytorch.org/whl/cu130
deep = ["torch>=2.7", "torchvision>=0.22", "torch-geometric>=2.6"]
# Phase 4: the flow-stats bake-off only (flow_catboost is a comparison model, not a member).
bakeoff = ["catboost>=1.2"]

[tool.setuptools.packages.find]
include = ["countdown*"]

[tool.setuptools.package-data]
"countdown.crypto" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: touches the full dataset corpus or its cache (deselect with -m 'not slow')",
]
